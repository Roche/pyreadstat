name: Windows Specific steps
description: "Builds libiconv and zlib for Windows with vcpkg (see vcpkg.json)"

runs:
  using: "composite"
  steps:
    - name: Cache vcpkg packages
      uses: actions/cache@v6
      with:
        path: vcpkg_installed
        key: vcpkg-${{ runner.arch }}-${{ hashFiles('vcpkg.json') }}

    - name: Install Windows libraries (vcpkg)
      shell: pwsh
      run: |
        # The runner's vcpkg clone may predate the builtin-baseline in
        # vcpkg.json. vcpkg reads the port version database from the
        # working tree, so fetching alone is not enough: check out the
        # baseline and bootstrap the matching vcpkg tool.
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
        git -C "$env:VCPKG_INSTALLATION_ROOT" fetch --quiet origin $baseline
        git -C "$env:VCPKG_INSTALLATION_ROOT" checkout --quiet --force $baseline
        & "$env:VCPKG_INSTALLATION_ROOT\bootstrap-vcpkg.bat" -disableMetrics
        $triplet = if ($env:RUNNER_ARCH -eq 'ARM64') { 'arm64-windows-static-md' } else { 'x64-windows-static-md' }
        & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install --triplet $triplet
